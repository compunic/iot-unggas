<!DOCTYPE html>
<html>
<head>
    <title>TV Monitoring Kandang</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #1e1e2f;
            color: white;
        }

        .header {
            text-align: center;
            padding: 10px;
            background: #111827;
            font-size: 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 10px;
            padding: 10px;
        }

        .card {
            border-radius: 10px;
            padding: 10px;
            background: #2c3e50;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .kpi {
            font-size: 18px;
            margin: 3px 0;
        }

        .aman { background: #14532d; }
        .warning { background: #92400e; }
        .bahaya { background: #7f1d1d; }

        canvas {
            height: 150px !important;
        }
    </style>
</head>

<body>

<div class="header">
    🐥 SMART POULTRY FARM - TV MONITORING
</div>

<div id="grid" class="grid"></div>

<script>

let devices = [];
let charts = {};

// ================= LOAD DEVICES =================
async function loadDevices() {
    let res = await fetch('/devices');
    devices = await res.json();

    let grid = document.getElementById("grid");
    grid.innerHTML = "";

    devices.forEach(dev => {
        let card = document.createElement("div");
        card.className = "card";
        card.id = "card_" + dev;

        card.innerHTML = `
            <div class="title">${dev}</div>
            <div class="kpi" id="suhu_${dev}">🌡️ --</div>
            <div class="kpi" id="hum_${dev}">💧 --</div>
            <div class="kpi" id="amonia_${dev}">🧪 --</div>
            <canvas id="chart_${dev}"></canvas>
        `;

        grid.appendChild(card);

        // buat chart
        let ctx = document.getElementById(`chart_${dev}`);
        charts[dev] = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Suhu', borderColor: 'red', data: [] },
                    { label: 'Hum', borderColor: 'blue', data: [] }
                ]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } }
            }
        });
    });
}

// ================= UPDATE PER DEVICE =================
async function updateDevice(dev) {

    // STATUS
    let res1 = await fetch(`/analysis?nama_esp=${dev}`);
    let data = await res1.json();

    let card = document.getElementById("card_" + dev);

    let color = "aman";
    if (data.kondisi === "WARNING") color = "warning";
    if (data.kondisi === "BAHAYA") color = "bahaya";

    card.className = "card " + color;

    document.getElementById(`suhu_${dev}`).innerHTML =
        `🌡️ ${data.suhu}°C (${data.status_suhu})`;

    document.getElementById(`hum_${dev}`).innerHTML =
        `💧 ${data.kelembaban}% (${data.status_kelembaban})`;

    document.getElementById(`amonia_${dev}`).innerHTML =
        `🧪 ${data.amonia ?? '-'} ppm (${data.status_amonia})`;


    // CHART
    let res2 = await fetch(`/chart-data?range=hour&nama_esp=${dev}`);
    let chartData = await res2.json();

    let chart = charts[dev];

    chart.data.labels = chartData.waktu;
    chart.data.datasets[0].data = chartData.suhu;
    chart.data.datasets[1].data = chartData.kelembaban;

    chart.update();
}

// ================= UPDATE ALL =================
async function updateAll() {
    for (let dev of devices) {
        updateDevice(dev);
    }
}

// ================= AUTO REFRESH =================
setInterval(updateAll, 5000);

// INIT
(async () => {
    await loadDevices();
    updateAll();
})();
</script>

</body>
</html>
