<!DOCTYPE html>
<html>
<head>
    <title>Smart Poultry Farm Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { margin: 0; font-family: Arial; background: #eef2f3; }

        .header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container { width: 90%; margin: auto; }

        .card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .kpi {
            flex: 1;
            min-width: 200px;
            text-align: center;
            font-size: 18px;
        }

        button {
            margin: 5px;
            padding: 8px 12px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #3498db;
            color: white;
        }

        button:hover { background: #2980b9; }

        select {
            padding: 8px;
            border-radius: 5px;
            margin-left: 10px;
        }

        .good { color: green; }
        .warning { color: orange; }
        .danger { color: red; }

        canvas { height: 300px !important; }
    </style>
</head>

<body>

<div class="header">
    <h1>🐥 Smart Poultry Farm Monitoring System</h1>
    <p>Monitoring Multi Kandang (Suhu • Kelembaban • Amonia)</p>
</div>

<div class="container">

<!-- FILTER + DEVICE -->
<div class="card">
    Pilih Kandang:
    <select id="deviceSelect" onchange="changeDevice()"></select>

    <br><br>

    <button onclick="loadData('minute')">Menit</button>
    <button onclick="loadData('hour')">Jam</button>
    <button onclick="loadData('weekly')">Mingguan</button>
    <button onclick="loadData('monthly')">Bulanan</button>
</div>

<!-- KPI -->
<div class="grid">
    <div class="card kpi" id="kpiSuhu">🌡️ -- °C</div>
    <div class="card kpi" id="kpiHum">💧 -- %</div>
    <div class="card kpi" id="kpiAmonia">🧪 -- ppm</div>
</div>

<!-- STATUS -->
<div class="card" id="statusBox">
    Loading status...
</div>

<!-- CHART -->
<div class="card">
    <h3>📊 Grafik Lingkungan Kandang</h3>
    <canvas id="chartGabung"></canvas>
</div>

</div>

<script>

let currentRange = "hour";
let currentDevice = "";

// ================= LOAD DEVICES =================
async function loadDevices() {
    let res = await fetch('/devices');
    let devices = await res.json();

    let select = document.getElementById("deviceSelect");
    select.innerHTML = "";

    devices.forEach(d => {
        let opt = document.createElement("option");
        opt.value = d;
        opt.text = d;
        select.appendChild(opt);
    });

    if (devices.length > 0) {
        currentDevice = devices[0];
        select.value = currentDevice;
    }
}

// ================= CHANGE DEVICE =================
function changeDevice() {
    currentDevice = document.getElementById("deviceSelect").value;
    loadData(currentRange);
    updateStatus();
}

// ================= CHART =================
let chartGabung = new Chart(document.getElementById('chartGabung'), {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            { label: 'Suhu (°C)', borderColor: 'red', data: [], yAxisID: 'y1' },
            { label: 'Kelembaban (%)', borderColor: 'blue', data: [], yAxisID: 'y2' },
            { label: 'Amonia (ppm)', borderColor: 'green', data: [], yAxisID: 'y2' }
        ]
    },
    options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        scales: {
            y1: {
                type: 'linear',
                position: 'left',
                title: { display: true, text: 'Suhu (°C)' }
            },
            y2: {
                type: 'linear',
                position: 'right',
                title: { display: true, text: 'Kelembaban / Amonia' },
                grid: { drawOnChartArea: false }
            }
        }
    }
});

// ================= LOAD DATA =================
async function loadData(range='hour') {
    currentRange = range;

    if (!currentDevice) return;

    let res = await fetch(`/chart-data?range=${range}&nama_esp=${currentDevice}`);
    let data = await res.json();

    chartGabung.data.labels = data.waktu;
    chartGabung.data.datasets[0].data = data.suhu;
    chartGabung.data.datasets[1].data = data.kelembaban;
    chartGabung.data.datasets[2].data = data.amonia;

    chartGabung.update();
}

// ================= STATUS =================
async function updateStatus() {
    if (!currentDevice) return;

    let res = await fetch(`/analysis?nama_esp=${currentDevice}`);
    let data = await res.json();

    let box = document.getElementById("statusBox");

    let color = "good";
    if (data.kondisi === "WARNING") color = "warning";
    if (data.kondisi === "BAHAYA") color = "danger";

    box.className = "card " + color;

    box.innerHTML = `
        <h3>📊 Status ${currentDevice}</h3>
        🌡️ ${data.suhu}°C → ${data.status_suhu}<br>
        💧 ${data.kelembaban}% → ${data.status_kelembaban}<br>
        🧪 ${data.amonia ?? '-'} ppm → ${data.status_amonia}<br>
        🐥 <b>${data.kondisi}</b>
    `;

    document.getElementById("kpiSuhu").innerHTML = "🌡️ " + data.suhu + " °C";
    document.getElementById("kpiHum").innerHTML = "💧 " + data.kelembaban + " %";
    document.getElementById("kpiAmonia").innerHTML = "🧪 " + (data.amonia ?? '-') + " ppm";
}

// ================= REALTIME =================
setInterval(() => {
    loadData(currentRange);
    updateStatus();
}, 3000);

// INIT
(async () => {
    await loadDevices();
    loadData('hour');
    updateStatus();
})();

</script>

</body>
</html>
